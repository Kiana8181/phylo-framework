name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Dependency vulnerability gate. Also runs on the weekly schedule above, so a
  # newly published advisory is noticed without waiting for the next push.
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit npm and Python dependencies
        run: bash scripts/security-audit.sh
      # No credential and no env file among the tracked files. Prints kinds,
      # places and fingerprints only, never a value.
      - name: Scan tracked files for credentials
        run: python scripts/scan_secrets.py
  unit-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            apps/api/requirements.txt
      - run: npm ci
      - run: python -m pip install -r requirements-test.txt
      - run: npm test
      - name: Upload coverage, JUnit and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-integration-reports
          path: coverage/
          retention-days: 30
          if-no-files-found: error
      - name: Remove only test infrastructure
        if: always()
        run: docker compose -f docker-compose.test.yml --profile full down -v
  scientific-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: unit-integration
    steps:
      # Every runtime image (two on the large immcantation/suite R image) plus
      # the instrumented ones do not fit in the space a runner leaves free: the
      # disk filled during the browser tests (ENOSPC, Chromium "Page crashed").
      # Remove preinstalled toolchains this job never uses (~25 GB).
      - name: Free disk space for the image builds
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            apps/api/requirements.txt
      - run: npm ci
      - run: python -m pip install -r requirements-test.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:all -- --build
      # The browser tests use the web dev server, so test:all builds every
      # runtime image except the web one. Build it as web-prod does (same
      # Dockerfile, context, tag and default API URL). Plain docker build:
      # compose would demand the .env credentials, which the web image needs none of.
      - name: Build the web image for the scan
        run: docker build -f apps/web/Dockerfile -t phylo-web:latest .
      # The job above has just built the other runtime images, so scan them here
      # instead of building them a second time. Runs on every push and on the
      # weekly schedule. Reports land in coverage/security/ and are uploaded
      # with the other artifacts below, also when the gate fails.
      - name: Scan runtime images and audit R packages
        run: bash scripts/security-audit.sh images && bash scripts/security-audit.sh r
      - name: Upload scientific evidence, traces and all coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-system-reports
          path: |
            coverage/
            test-results/
          retention-days: 30
          if-no-files-found: error
      - name: Remove only test infrastructure
        if: always()
        run: |
          df -h /
          docker system df
          docker compose -f docker-compose.test.yml --profile full down -v
