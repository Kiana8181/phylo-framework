name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Dependency vulnerability gate. Also runs on the weekly schedule above, so a
  # newly published advisory is noticed without waiting for the next push.
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit npm and Python dependencies
        run: bash scripts/security-audit.sh
  unit-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            apps/api/requirements.txt
      - run: npm ci
      - run: python -m pip install -r requirements-test.txt
      - run: npm test
      - name: Upload coverage, JUnit and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-integration-reports
          path: coverage/
          retention-days: 30
          if-no-files-found: error
      - name: Remove only test infrastructure
        if: always()
        run: docker compose -f docker-compose.test.yml --profile full down -v
  scientific-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: unit-integration
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            apps/api/requirements.txt
      - run: npm ci
      - run: python -m pip install -r requirements-test.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:all -- --build
      - name: Upload scientific evidence, traces and all coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-system-reports
          path: |
            coverage/
            test-results/
          retention-days: 30
          if-no-files-found: error
      - name: Remove only test infrastructure
        if: always()
        run: docker compose -f docker-compose.test.yml --profile full down -v
