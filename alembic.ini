# Alembic configuration for phylo-framework
# Run migrations from project root: alembic upgrade head

[alembic]
# path to migration scripts (relative to this file)
script_location = apps/api/database/migrations

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# the output encoding used when revision files are written
output_encoding = utf-8

# sqlalchemy.url is set dynamically in env.py from DATABASE_URL
sqlalchemy.url = 

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
