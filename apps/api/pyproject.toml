[project]
name = "phylo-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn[standard]", "pydantic-settings", "python-multipart", "redis", "rq"]

[project.optional-dependencies]
test = ["pytest>=8.4", "pytest-asyncio>=0.23", "httpx>=0.28"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
