# Credentials have no fallback values: every `${VAR:?...}` below makes Compose
# refuse to start until that variable is set in .env (copy .env.example first).
# Host ports for Postgres/MinIO are NOT published here; local host-run
# development adds them through docker-compose.dev.yml.
#
# Shared-server rules applied to every long-running service:
#   - CPU / memory / process limits. The PHYLO_CPUS_*, PHYLO_MEM_*, PHYLO_PIDS_*
#     values come from scripts/resource-plan.sh, which splits ONE global budget
#     (PHYLO_CPU_BUDGET, PHYLO_MEMORY_BUDGET_MB, PHYLO_PIDS_BUDGET). The fallback
#     numbers below are that script's plan for its default budget.
#   - Swap is disabled per container (memswap_limit = mem_limit), so a memory
#     limit is a hard ceiling: a container that exceeds it is OOM-killed and
#     then restarted by the restart policy.
#   - Only the API and the worker read .env. Every other container receives an
#     explicit list of the variables it needs, so the method services (which
#     parse untrusted uploads) and the web server never hold the database
#     password, the MinIO root password or the JWT signing key.
#   - Postgres, MinIO and the method services sit on internal networks with no
#     route to the internet (Postgres on its own, away from the method
#     services). Other containers reach them by unique names
#     (phylo-postgres, phylo-minio, phylo-dowser, ...), which cannot be confused
#     with another project's services on the shared reverse-proxy network.

# Bounded container logs (applies to `docker logs`, json-file driver).
x-logging: &default_logging
  driver: json-file
  options:
    max-size: ${PHYLO_LOG_MAX_SIZE:-10m}
    max-file: "${PHYLO_LOG_MAX_FILES:-5}"

# Every service: bounded logs, no privilege escalation through setuid binaries.
x-base: &base
  logging: *default_logging
  security_opt:
    - no-new-privileges:true

# Long-running services additionally come back after a crash, an OOM kill or a
# host reboot, and may be placed under a host parent cgroup that enforces the
# whole budget at once (optional, see docs/DEPLOYMENT.md).
x-service: &service
  <<: *base
  restart: unless-stopped
  cgroup_parent: ${PHYLO_CGROUP_PARENT:-}

x-api-common-env: &api_common_env
  CONTRACTS_DIR: /contracts
  # Environment identity written by `npm run version:capture` at build/deploy
  # time and copied into each run's result. A missing file costs the
  # version_info block and nothing else — the run still completes.
  PHYLO_VERSION_INFO_PATH: /version-info.json
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  STRICT_CONTRACT_ROUTES: ${STRICT_CONTRACT_ROUTES:-true}
  HOST_RUNTIME_SHARED_ROOT: ${HOST_RUNTIME_SHARED_ROOT:-/runtime/storage}
  STORAGE_LOCAL_PATH: ${HOST_RUNTIME_SHARED_ROOT:-/runtime/storage}
  METHOD_SERVICE_FILE_PREFIX: ${METHOD_SERVICE_FILE_PREFIX:-/runtime/storage}
  # Object storage (self-hosted MinIO; S3-compatible)
  STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
  # Use the in-cluster endpoint inside containers; the host-side .env value of
  # S3_ENDPOINT_URL (localhost) is only for host-run scripts/dev.
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL_DOCKER:-http://phylo-minio:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}}
  S3_BUCKET_DATASETS: ${S3_BUCKET_DATASETS:-phylo-datasets}
  S3_BUCKET_ARTIFACTS: ${S3_BUCKET_ARTIFACTS:-phylo-artifacts}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
  POSTGRES_HOST: phylo-postgres
  POSTGRES_PORT: "5432"
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@phylo-postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
  METHOD_DOWSER_URL: ${METHOD_DOWSER_URL_DOCKER:-http://phylo-dowser:8001}
  METHOD_GCTREE_URL: ${METHOD_GCTREE_URL_DOCKER:-http://phylo-gctree:8002}
  METHOD_BREPPHYLO_URL: ${METHOD_BREPPHYLO_URL_DOCKER:-http://phylo-brepphylo:8003}
  METHOD_CLONALTREE_URL: ${METHOD_CLONALTREE_URL_DOCKER:-http://phylo-clonaltree:8004}

# Production API + worker. ENV=production switches on the start-up check that
# refuses known-default or weak secrets (apps/api/security/production_config.py)
# and stops internal error text from reaching clients. Set here, after
# env_file, so a stray ENV in .env cannot turn it off.
x-api-prod-env: &api_prod_env
  <<: *api_common_env
  ENV: production
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}

x-method-common-env: &method_common_env
  CONTRACTS_DIR: /contracts
  STRICT_CONTRACT_ROUTES: ${STRICT_CONTRACT_ROUTES:-true}
  RUNS_DIR: ${METHOD_SERVICE_FILE_PREFIX:-/runtime/storage}
  METHOD_SERVICE_FILE_PREFIX: ${METHOD_SERVICE_FILE_PREFIX:-/runtime/storage}
  # Writable directory for per-job state files (status.json/request.json/job.log)
  # internal to each method container. Not shared with worker — methods upload
  # final artifact files directly to MinIO instead.
  METHOD_JOBS_DIR: ${METHOD_JOBS_DIR:-/runtime/method-jobs}
  # Object storage: methods upload artifact files (PNG/PDF/ZIP/log) directly to
  # the artifact bucket using a scoped PutObject-only user. No shared volume
  # with the worker is needed for artifacts.
  STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL_DOCKER:-http://phylo-minio:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${MINIO_METHODS_USER:?set MINIO_METHODS_USER in .env}
  S3_SECRET_ACCESS_KEY: ${MINIO_METHODS_PASSWORD:?set MINIO_METHODS_PASSWORD in .env}
  S3_BUCKET_ARTIFACTS: ${S3_BUCKET_ARTIFACTS:-phylo-artifacts}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  # Seconds a cancelled job gets to stop before it is killed.
  JOB_CANCEL_GRACE_SECONDS: ${JOB_CANCEL_GRACE_SECONDS:-5}

services:
  postgres:
    image: postgres:15-alpine
    container_name: phylo-postgres
    <<: *service
    cpus: ${PHYLO_CPUS_POSTGRES:-0.36}
    mem_limit: ${PHYLO_MEM_POSTGRES:-389m}
    memswap_limit: ${PHYLO_MEM_POSTGRES:-389m}
    pids_limit: ${PHYLO_PIDS_POSTGRES:-384}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # ports:
    #   - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - phylo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER in .env} -d ${POSTGRES_DB:?set POSTGRES_DB in .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["dev", "prod"]
    # Only the API and the worker share this network: the method services
    # cannot even open a connection to the database.
    networks:
      phylo_db:
        aliases: [phylo-postgres]

  # Object store: Silo, the maintained community fork of MinIO (upstream MinIO
  # no longer publishes images). It speaks the same protocol, uses the same
  # MINIO_* settings and the same on-disk format, so the service keeps its name
  # and an existing data volume is used as it is. Pinned by digest
  # (RELEASE.2026-09-16, distroless build); see docs/OBJECT-STORAGE-OPTIONS.md.
  # PHYLO_OBJECT_STORE_IMAGE lets a deployment pull the same digest from a
  # registry mirror it controls.
  minio:
    image: ${PHYLO_OBJECT_STORE_IMAGE:-pgsty/silo@sha256:32a8a777d90f3296294c9a57da5e8d397121187c4b868b2a7fc7874c726c0291}
    container_name: phylo-minio
    <<: *service
    cpus: ${PHYLO_CPUS_MINIO:-0.30}
    mem_limit: ${PHYLO_MEM_MINIO:-450m}
    memswap_limit: ${PHYLO_MEM_MINIO:-450m}
    pids_limit: ${PHYLO_PIDS_MINIO:-384}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    # Keep MinIO internal on the server; reach the console via SSH tunnel if needed.
    # ports:
    #   - "${MINIO_API_PORT:-9000}:9000"
    #   - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - phylo_minio_data:/data
    # No healthcheck: the minio server image ships no curl/mc client. The
    # minio-init service below retries until MinIO is reachable and the API
    # gates on minio-init completing successfully.
    profiles: ["dev", "prod"]
    networks:
      phylo_internal:
        aliases: [phylo-minio]

  # One-shot: waits for MinIO, then creates the dataset + artifact buckets.
  # No restart policy: it must run once and exit.
  minio-init:
    image: ${PHYLO_OBJECT_STORE_CLIENT_IMAGE:-pgsty/mc@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd}
    container_name: phylo-minio-init
    <<: *base
    restart: "no"
    cgroup_parent: ${PHYLO_CGROUP_PARENT:-}
    cpus: ${PHYLO_CPUS_MINIO_INIT:-0.10}
    mem_limit: ${PHYLO_MEM_MINIO_INIT:-256m}
    memswap_limit: ${PHYLO_MEM_MINIO_INIT:-256m}
    pids_limit: ${PHYLO_PIDS_MINIO_INIT:-64}
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_METHODS_USER: ${MINIO_METHODS_USER:?set MINIO_METHODS_USER in .env}
      MINIO_METHODS_PASSWORD: ${MINIO_METHODS_PASSWORD:?set MINIO_METHODS_PASSWORD in .env}
      S3_BUCKET_DATASETS: ${S3_BUCKET_DATASETS:-phylo-datasets}
      S3_BUCKET_ARTIFACTS: ${S3_BUCKET_ARTIFACTS:-phylo-artifacts}
    # Fails loudly: a step that goes wrong stops the script with a non-zero exit
    # code, and the last step checks that the methods user really exists with
    # its policy. The API waits for this container to finish successfully, so a
    # broken object-store setup blocks start-up instead of producing runs that
    # silently lose their artifacts.
    entrypoint: >
      /bin/sh -c "
      set -e;
      n=0;
      until mc alias set local http://phylo-minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} >/tmp/alias.log 2>&1; do
        n=$$((n+1));
        if [ $$n -ge 60 ]; then echo 'ERROR: could not log in to MinIO after 2 minutes:' >&2; cat /tmp/alias.log >&2; exit 1; fi;
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/$${S3_BUCKET_DATASETS};
      mc mb --ignore-existing local/$${S3_BUCKET_ARTIFACTS};
      echo 'minio buckets ready';
      printf '%s\n' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:PutObject\"],\"Resource\":\"arn:aws:s3:::'\"$${S3_BUCKET_ARTIFACTS}\"'/*\"}]}' > /tmp/methods-policy.json;
      mc admin policy create local phylo-methods-write /tmp/methods-policy.json;
      mc admin user add local $${MINIO_METHODS_USER} $${MINIO_METHODS_PASSWORD};
      mc admin policy attach local phylo-methods-write --user $${MINIO_METHODS_USER} 2>/dev/null || true;
      case \"$$(mc admin user info local $${MINIO_METHODS_USER} 2>&1)\" in
        *phylo-methods-write*) echo 'methods user ready' ;;
        *) echo 'ERROR: the methods user was not created with the phylo-methods-write policy' >&2; exit 1 ;;
      esac
      "
    profiles: ["dev", "prod"]
    networks:
      - phylo_internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # The dev server runs `npm`, which only the build stage carries; the
      # production (runtime) stage ships without a package manager.
      target: build
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    image: phylo-web:dev
    <<: *base
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on: [api]
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: .
        target: /srv
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
    command: sh -lc "npm -w web run dev -- -p ${WEB_PORT:-3000}"
    profiles: ["dev"]
    networks:
      - phylo_egress

  web-prod:
    container_name: phylo-web-prod
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    image: phylo-web:latest
    <<: *service
    cpus: ${PHYLO_CPUS_WEB:-0.15}
    mem_limit: ${PHYLO_MEM_WEB:-289m}
    memswap_limit: ${PHYLO_MEM_WEB:-289m}
    pids_limit: ${PHYLO_PIDS_WEB:-256}
    # Serves static pages and proxies nothing: it needs no Linux capabilities.
    cap_drop:
      - ALL
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    depends_on:
      api-prod:
        condition: service_healthy
    # ports:
    #   - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles: ["prod"]
    # Browsers call the API through the reverse proxy; the web server itself
    # talks to no other container, so it is only on the proxy network.
    networks:
      - proxy_net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: phylo-api:latest
    <<: *base
    env_file:
      - ./.env
    environment:
      <<: *api_common_env
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      dowser:
        condition: service_started
      gctree:
        condition: service_started
      brepphylo:
        condition: service_started
      clonaltree:
        condition: service_started
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ${STORAGE_LOCAL_PATH:-runtime/storage}
        target: /runtime/storage
    command: sh -lc "alembic upgrade head && exec uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload"
    profiles: ["dev"]
    networks:
      - phylo_db
      - phylo_internal
      - phylo_egress

  api-worker:
    image: phylo-api:latest
    <<: *base
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - ./.env
    environment:
      <<: *api_common_env
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ${STORAGE_LOCAL_PATH:-runtime/storage}
        target: /runtime/storage
      - type: bind
        source: ./runtime/version-info.json
        target: /version-info.json
        read_only: true
    command: sh -lc "python -m apps.api.workers.run_worker"
    profiles: ["dev"]
    networks:
      - phylo_db
      - phylo_internal
      - phylo_egress

  api-prod:
    container_name: phylo-api-prod
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: phylo-api:latest
    <<: *service
    cpus: ${PHYLO_CPUS_API:-0.48}
    mem_limit: ${PHYLO_MEM_API:-322m}
    memswap_limit: ${PHYLO_MEM_API:-322m}
    pids_limit: ${PHYLO_PIDS_API:-256}
    env_file:
      - ./.env
    environment:
      <<: *api_prod_env
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      dowser:
        condition: service_started
      gctree:
        condition: service_started
      brepphylo:
        condition: service_started
      clonaltree:
        condition: service_started
    # ports:
    #   - "${API_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ${STORAGE_LOCAL_PATH:-runtime/storage}
        target: /runtime/storage
    command: sh -lc "alembic upgrade head && exec uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    profiles: ["prod"]
    # db:       the database.
    # internal: object store and method services.
    # egress:   outbound calls (Google sign-in, mail).
    # proxy:    inbound traffic from the reverse proxy.
    networks:
      - phylo_db
      - phylo_internal
      - phylo_egress
      - proxy_net

  api-worker-prod:
    container_name: phylo-api-worker-prod
    image: phylo-api:latest
    <<: *service
    cpus: ${PHYLO_CPUS_WORKER:-0.15}
    mem_limit: ${PHYLO_MEM_WORKER:-225m}
    memswap_limit: ${PHYLO_MEM_WORKER:-225m}
    pids_limit: ${PHYLO_PIDS_WORKER:-192}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - ./.env
    environment:
      <<: *api_prod_env
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api-prod:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ${STORAGE_LOCAL_PATH:-runtime/storage}
        target: /runtime/storage
      - type: bind
        source: ./runtime/version-info.json
        target: /version-info.json
        read_only: true
    command: sh -lc "python -m apps.api.workers.run_worker"
    profiles: ["prod"]
    networks:
      - phylo_db
      - phylo_internal
      - phylo_egress

  dowser:
    container_name: phylo-dowser
    <<: *service
    cpus: ${PHYLO_CPUS_DOWSER:-0.60}
    mem_limit: ${PHYLO_MEM_DOWSER:-2448m}
    memswap_limit: ${PHYLO_MEM_DOWSER:-2448m}
    pids_limit: ${PHYLO_PIDS_DOWSER:-512}
    # Parses untrusted uploads: no capabilities, no .env, no internet.
    cap_drop:
      - ALL
    # A minimal init as PID 1 reaps finished job processes. Measured without
    # it: every R job leaves one zombie behind, which counts against
    # pids_limit until the container restarts.
    init: true
    platform: ${IMMCANTATION_PLATFORM:-linux/amd64}
    build:
      context: ./services/dowser
      dockerfile: Dockerfile
    image: phylo-dowser:latest
    environment:
      <<: *method_common_env
      METHOD_DOWSER_CONTAINER_PORT: ${METHOD_DOWSER_CONTAINER_PORT:-8001}
      DNAPARS_PATH: ${DNAPARS_PATH:-/usr/local/bin/dnapars}
      DNAML_PATH: ${DNAML_PATH:-/usr/local/bin/dnaml}
      RAXML_BIN: ${RAXML_BIN:-/usr/local/bin/raxml-ng}
      IGPHYML_BIN: ${IGPHYML_BIN:-/usr/local/share/igphyml/src/igphyml}
      IGPHYML_MOTIFS: ${IGPHYML_MOTIFS:-/usr/local/share/igphyml/src/motifs}
      IGPHYML_PATH: ${IGPHYML_PATH:-/usr/local/share/igphyml/src/motifs}
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ${STORAGE_LOCAL_PATH:-runtime/storage}
        target: /runtime/storage
        read_only: true
    # expose:
    #   - "${METHOD_DOWSER_CONTAINER_PORT:-8001}"
    command:
      [
        "R",
        "-q",
        "-e",
        "port <- as.integer(Sys.getenv('METHOD_DOWSER_CONTAINER_PORT', '8001')); pr <- plumber::plumb('/srv/plumber.R'); pr$$run(host='0.0.0.0', port=port)",
      ]
    profiles: ["dev", "prod"]
    networks:
      phylo_internal:
        aliases: [phylo-dowser]

  gctree:
    container_name: phylo-gctree
    <<: *service
    cpus: ${PHYLO_CPUS_GCTREE:-0.60}
    mem_limit: ${PHYLO_MEM_GCTREE:-778m}
    memswap_limit: ${PHYLO_MEM_GCTREE:-778m}
    pids_limit: ${PHYLO_PIDS_GCTREE:-768}
    # Parses untrusted uploads: no capabilities, no .env, no internet.
    cap_drop:
      - ALL
    build:
      context: ./services/gctree
      dockerfile: Dockerfile
    image: phylo-gctree:latest
    environment:
      <<: *method_common_env
      METHOD_GCTREE_CONTAINER_PORT: ${METHOD_GCTREE_CONTAINER_PORT:-8002}
      PYTHONHASHSEED: "0"
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ${STORAGE_LOCAL_PATH:-runtime/storage}
        target: /runtime/storage
        read_only: true
    # expose:
    #   - "${METHOD_GCTREE_CONTAINER_PORT:-8002}"
    command: sh -lc "uvicorn app:app --host 0.0.0.0 --port ${METHOD_GCTREE_CONTAINER_PORT:-8002}"
    profiles: ["dev", "prod"]
    networks:
      phylo_internal:
        aliases: [phylo-gctree]

  brepphylo:
    container_name: phylo-brepphylo
    <<: *service
    cpus: ${PHYLO_CPUS_BREPPHYLO:-0.60}
    mem_limit: ${PHYLO_MEM_BREPPHYLO:-2448m}
    memswap_limit: ${PHYLO_MEM_BREPPHYLO:-2448m}
    pids_limit: ${PHYLO_PIDS_BREPPHYLO:-512}
    # Parses untrusted uploads: no capabilities, no .env, no internet.
    cap_drop:
      - ALL
    # A minimal init as PID 1 reaps finished job processes. Measured without
    # it: every R job leaves one zombie behind, which counts against
    # pids_limit until the container restarts.
    init: true
    platform: ${IMMCANTATION_PLATFORM:-linux/amd64}
    build:
      context: ./services/brepphylo
      dockerfile: Dockerfile
    image: phylo-brepphylo:latest
    environment:
      <<: *method_common_env
      METHOD_BREPPHYLO_CONTAINER_PORT: ${METHOD_BREPPHYLO_CONTAINER_PORT:-8003}
      DNAPARS_PATH: ${DNAPARS_PATH:-/usr/local/bin/dnapars}
      IGPHYML_BIN: ${IGPHYML_BIN:-/usr/local/share/igphyml/src/igphyml}
      IGPHYML_MOTIFS: ${IGPHYML_MOTIFS:-/usr/local/share/igphyml/src/motifs}
      IGPHYML_PATH: ${IGPHYML_PATH:-/usr/local/share/igphyml/src/motifs}
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ${STORAGE_LOCAL_PATH:-runtime/storage}
        target: /runtime/storage
        read_only: true
    # expose:
    #   - "${METHOD_BREPPHYLO_CONTAINER_PORT:-8003}"
    command:
      [
        "R",
        "-q",
        "-e",
        "port <- as.integer(Sys.getenv('METHOD_BREPPHYLO_CONTAINER_PORT', '8003')); pr <- plumber::plumb('/srv/plumber.R'); pr$$run(host='0.0.0.0', port=port)",
      ]
    profiles: ["dev", "prod"]
    networks:
      phylo_internal:
        aliases: [phylo-brepphylo]

  clonaltree:
    container_name: phylo-clonaltree
    <<: *service
    cpus: ${PHYLO_CPUS_CLONALTREE:-0.60}
    mem_limit: ${PHYLO_MEM_CLONALTREE:-584m}
    memswap_limit: ${PHYLO_MEM_CLONALTREE:-584m}
    pids_limit: ${PHYLO_PIDS_CLONALTREE:-768}
    # Parses untrusted uploads: no capabilities, no .env, no internet.
    cap_drop:
      - ALL
    # A minimal init as PID 1 reaps finished job processes. Measured without
    # it: every R job leaves one zombie behind, which counts against
    # pids_limit until the container restarts.
    init: true
    build:
      context: ./services/clonaltree
      dockerfile: Dockerfile
    image: phylo-clonaltree:latest
    environment:
      <<: *method_common_env
      METHOD_CLONALTREE_CONTAINER_PORT: ${METHOD_CLONALTREE_CONTAINER_PORT:-8004}
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ${STORAGE_LOCAL_PATH:-runtime/storage}
        target: /runtime/storage
        read_only: true
    # expose:
    #   - "${METHOD_CLONALTREE_CONTAINER_PORT:-8004}"
    command: sh -lc "uvicorn app:app --host 0.0.0.0 --port ${METHOD_CLONALTREE_CONTAINER_PORT:-8004}"
    profiles: ["dev", "prod"]
    networks:
      phylo_internal:
        aliases: [phylo-clonaltree]

volumes:
  phylo_postgres_data:
    name: phylo_postgres_data
  phylo_minio_data:
    name: phylo_minio_data

networks:
  # The reverse proxy's shared network: created and owned by the infrastructure
  # team, so it stays external.
  proxy_net:
    external: true
  # Project networks, created by Compose itself (no manual
  # `docker network create`). Their real names are prefixed with the Compose
  # project name, so they cannot collide with another project's networks.
  #
  # Both internal networks have no route to the internet and none from the
  # host.
  # db: Postgres, reachable by the API and the worker only.
  phylo_db:
    internal: true
  # internal: MinIO and the method services, plus the API and the worker.
  phylo_internal:
    internal: true
  # Outbound-capable network for the API and the worker only.
  phylo_egress: {}
