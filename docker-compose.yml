# docker-compose.yml  (only showing the service blocks)

x-env-common: &env_common
  CONTRACTS_DIR: /contracts
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  METHOD_DOWSER_URL: http://dowser:8001
  METHOD_GCTREE_URL: http://gctree:8002
  METHOD_BREPPHYLO_URL: http://brepphylo:8003
  HTTP_CLIENT_TIMEOUT: "600"
  SPEC_TIMEOUT: "60"
  RUNS_DIR: /shared

services:
  # --- UI: DEV ---
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: phylo-web:latest
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]
    volumes:
      - type: bind
        source: .
        target: /srv
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
    command: npm -w web run dev -- -p 3000
    profiles: ["dev"]

  # --- UI: PROD ---
  web-prod:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: phylo-web:latest
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8000
    depends_on: [api-prod]
    ports: ["3000:3000"]
    profiles: ["prod"]
    # no volumes; image is self-contained

  # --- API: DEV ---
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: phylo-api:latest
    environment:
      <<: *env_common
      RUNS_DIR: /runtime/runs
    depends_on: [dowser, gctree, brepphylo]
    ports: ["8000:8000"]
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ./runtime/runs
        target: /runtime/runs
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload
    profiles: ["dev"]

  # --- API: PROD ---
  api-prod:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: phylo-api:latest
    environment:
      <<: *env_common
      RUNS_DIR: /runtime/runs
    depends_on: [dowser, gctree, brepphylo]
    ports: ["8000:8000"]
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ./runtime/runs
        target: /runtime/runs
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    profiles: ["prod"]

  dowser:
    build:
      context: ./services/dowser
      dockerfile: Dockerfile
    image: phylo-dowser:latest
    environment:
      CONTRACTS_DIR: /contracts
      STRICT_CONTRACT_ROUTES: ${STRICT_CONTRACT_ROUTES:-true}
      RUNS_DIR: /runtime/runs   # not used by R, but nice to keep consistent
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ./runtime/runs   # <---- same host folder
        target: /runtime/runs    # <---- same path inside dowser
        read_only: true          # dowser only reads files
    expose: ["8001"]
    profiles: ["dev","prod"]

  gctree:
    build:
      context: ./services/gctree
      dockerfile: Dockerfile
    image: phylo-gctree:latest
    environment:
      CONTRACTS_DIR: /contracts
      STRICT_CONTRACT_ROUTES: ${STRICT_CONTRACT_ROUTES:-true}
    volumes:
      - type: bind
        source: ./runtime
        target: /shared        
        read_only: true
    expose: ["8002"]
    profiles: ["dev","prod"]

  brepphylo:
    build:
      context: ./services/brepphylo
      dockerfile: Dockerfile
    image: phylo-brepphylo:latest
    environment:
      CONTRACTS_DIR: /contracts
      STRICT_CONTRACT_ROUTES: ${STRICT_CONTRACT_ROUTES:-true}
      RUNS_DIR: /runtime/runs
      DNAPARS_PATH: /usr/local/bin/dnapars
      IGPHYML_BIN: igphyml
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ./runtime/runs
        target: /runtime/runs
        read_only: true
    expose: ["8003"]
    profiles: ["dev","prod"]
