# docker-compose.yml  (only showing the service blocks)

x-env-common: &env_common
  CONTRACTS_DIR: /contracts
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  METHOD_DOWSER_URL: http://dowser:8001
  METHOD_GCTREE_URL: http://gctree:8002
  METHOD_BREPPHYLO_URL: http://brepphylo:8003
  METHOD_CLONALTREE_URL: http://clonaltree:8004
  HTTP_CLIENT_TIMEOUT: "600"
  SPEC_TIMEOUT: "60"
  RUNS_DIR: /shared
  POSTGRES_USER: ${POSTGRES_USER:-phylo_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phylo_pass}
  POSTGRES_DB: ${POSTGRES_DB:-phylo_db}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-phylo_user}:${POSTGRES_PASSWORD:-phylo_pass}@postgres:5432/${POSTGRES_DB:-phylo_db}

services:
  # --- PostgreSQL Database ---
  postgres:
    image: postgres:15-alpine
    container_name: phylo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phylo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phylo_pass}
      POSTGRES_DB: ${POSTGRES_DB:-phylo_db}
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phylo_user} -d ${POSTGRES_DB:-phylo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["dev", "prod"]

  # --- UI: DEV ---
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: phylo-web:latest
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]
    volumes:
      - type: bind
        source: .
        target: /srv
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
    command: npm -w web run dev -- -p 3000
    profiles: ["dev"]

  # --- UI: PROD ---
  web-prod:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: phylo-web:latest
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8000
    depends_on: [api-prod]
    ports: ["3000:3000"]
    profiles: ["prod"]
    # no volumes; image is self-contained

  # --- API: DEV ---
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: phylo-api:latest
    env_file:
      - apps/api/.env
    environment:
      <<: *env_common
      RUNS_DIR: /runtime/runs
    depends_on:
      postgres:
        condition: service_healthy
      dowser:
        condition: service_started
      gctree:
        condition: service_started
      brepphylo:
        condition: service_started
      clonaltree:
        condition: service_started
    ports: ["8000:8000"]
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ./runtime/runs
        target: /runtime/runs
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload
    profiles: ["dev"]

  # --- API: PROD ---
  api-prod:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: phylo-api:latest
    env_file:
      - apps/api/.env
    environment:
      <<: *env_common
      RUNS_DIR: /runtime/runs
    depends_on:
      postgres:
        condition: service_healthy
      dowser:
        condition: service_started
      gctree:
        condition: service_started
      brepphylo:
        condition: service_started
      clonaltree:
        condition: service_started
    ports: ["8000:8000"]
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ./runtime/runs
        target: /runtime/runs
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    profiles: ["prod"]

  dowser:
    build:
      context: ./services/dowser
      dockerfile: Dockerfile
    image: phylo-dowser:latest
    environment:
      CONTRACTS_DIR: /contracts
      STRICT_CONTRACT_ROUTES: ${STRICT_CONTRACT_ROUTES:-true}
      RUNS_DIR: /runtime/runs
      IGPHYML_BIN: /usr/local/share/igphyml/src/igphyml
      IGPHYML_MOTIFS: /usr/local/share/igphyml/src/motifs
      IGPHYML_PATH: /usr/local/share/igphyml/src/motifs
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ./runtime/runs
        target: /runtime/runs
        read_only: true
    expose: ["8001"]
    profiles: ["dev","prod"]

  gctree:
    build:
      context: ./services/gctree
      dockerfile: Dockerfile
    image: phylo-gctree:latest
    environment:
      CONTRACTS_DIR: /contracts
      STRICT_CONTRACT_ROUTES: ${STRICT_CONTRACT_ROUTES:-true}
      RUNS_DIR: /runtime/runs
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ./runtime/runs
        target: /runtime/runs
        read_only: true
    expose: ["8002"]
    profiles: ["dev","prod"]

  brepphylo:
    build:
      context: ./services/brepphylo
      dockerfile: Dockerfile
    image: phylo-brepphylo:latest
    environment:
      CONTRACTS_DIR: /contracts
      STRICT_CONTRACT_ROUTES: ${STRICT_CONTRACT_ROUTES:-true}
      RUNS_DIR: /runtime/runs
      DNAPARS_PATH: /usr/local/bin/dnapars
      IGPHYML_BIN: /usr/local/share/igphyml/src/igphyml
      IGPHYML_MOTIFS: /usr/local/share/igphyml/src/motifs
      IGPHYML_PATH: /usr/local/share/igphyml/src/motifs
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ./runtime/runs
        target: /runtime/runs
        read_only: true
    expose: ["8003"]
    profiles: ["dev","prod"]

  clonaltree:
    build:
      context: ./services/clonaltree
      dockerfile: Dockerfile
    image: phylo-clonaltree:latest
    environment:
      CONTRACTS_DIR: /contracts
      STRICT_CONTRACT_ROUTES: ${STRICT_CONTRACT_ROUTES:-true}
      RUNS_DIR: /runtime/runs
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ./runtime/runs
        target: /runtime/runs
        read_only: true
    expose: ["8004"]
    profiles: ["dev","prod"]

volumes:
  postgres_data:
