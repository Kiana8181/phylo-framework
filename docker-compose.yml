x-api-common-env: &api_common_env
  CONTRACTS_DIR: /contracts
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  STRICT_CONTRACT_ROUTES: ${STRICT_CONTRACT_ROUTES:-true}
  HOST_RUNTIME_SHARED_ROOT: ${HOST_RUNTIME_SHARED_ROOT:-/runtime/storage}
  STORAGE_LOCAL_PATH: ${HOST_RUNTIME_SHARED_ROOT:-/runtime/storage}
  METHOD_SERVICE_FILE_PREFIX: ${METHOD_SERVICE_FILE_PREFIX:-/runtime/storage}
  # Object storage (self-hosted MinIO; S3-compatible)
  STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
  # Use the in-cluster endpoint inside containers; the host-side .env value of
  # S3_ENDPOINT_URL (localhost) is only for host-run scripts/dev.
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL_DOCKER:-http://minio:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-phylo_minio}}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-phylo_minio_secret}}
  S3_BUCKET_DATASETS: ${S3_BUCKET_DATASETS:-phylo-datasets}
  S3_BUCKET_ARTIFACTS: ${S3_BUCKET_ARTIFACTS:-phylo-artifacts}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-phylo_user}:${POSTGRES_PASSWORD:-phylo_pass}@postgres:5432/${POSTGRES_DB:-phylo_db}
  METHOD_DOWSER_URL: ${METHOD_DOWSER_URL_DOCKER:-http://dowser:8001}
  METHOD_GCTREE_URL: ${METHOD_GCTREE_URL_DOCKER:-http://gctree:8002}
  METHOD_BREPPHYLO_URL: ${METHOD_BREPPHYLO_URL_DOCKER:-http://brepphylo:8003}
  METHOD_CLONALTREE_URL: ${METHOD_CLONALTREE_URL_DOCKER:-http://clonaltree:8004}

x-method-common-env: &method_common_env
  CONTRACTS_DIR: /contracts
  STRICT_CONTRACT_ROUTES: ${STRICT_CONTRACT_ROUTES:-true}
  RUNS_DIR: ${METHOD_SERVICE_FILE_PREFIX:-/runtime/storage}
  METHOD_SERVICE_FILE_PREFIX: ${METHOD_SERVICE_FILE_PREFIX:-/runtime/storage}
  # Writable directory for per-job state files (status.json/request.json/job.log)
  # internal to each method container. Not shared with worker — methods upload
  # final artifact files directly to MinIO instead.
  METHOD_JOBS_DIR: ${METHOD_JOBS_DIR:-/runtime/method-jobs}
  # Object storage: methods upload artifact files (PNG/PDF/ZIP/log) directly to
  # the artifact bucket using a scoped PutObject-only user. No shared volume
  # with the worker is needed for artifacts.
  STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL_DOCKER:-http://minio:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${MINIO_METHODS_USER:-phylo_methods}
  S3_SECRET_ACCESS_KEY: ${MINIO_METHODS_PASSWORD:-phylo_methods_secret}
  S3_BUCKET_ARTIFACTS: ${S3_BUCKET_ARTIFACTS:-phylo-artifacts}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}

services:
  postgres:
    image: postgres:15-alpine
    container_name: phylo-postgres
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phylo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phylo_pass}
      POSTGRES_DB: ${POSTGRES_DB:-phylo_db}
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phylo_user} -d ${POSTGRES_DB:-phylo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["dev", "prod"]

  minio:
    image: minio/minio:latest
    container_name: phylo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-phylo_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-phylo_minio_secret}
    ports:
      # API port is published for the host-side storage-check script / local SDK use.
      # In production, keep this internal and do not expose publicly.
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    # No healthcheck: the minio server image ships no curl/mc client. The
    # minio-init service below retries until MinIO is reachable and the API
    # gates on minio-init completing successfully.
    profiles: ["dev", "prod"]

  # One-shot: waits for MinIO, then creates the dataset + artifact buckets.
  minio-init:
    image: minio/mc:latest
    container_name: phylo-minio-init
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-phylo_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-phylo_minio_secret}
      MINIO_METHODS_USER: ${MINIO_METHODS_USER:-phylo_methods}
      MINIO_METHODS_PASSWORD: ${MINIO_METHODS_PASSWORD:-phylo_methods_secret}
      S3_BUCKET_DATASETS: ${S3_BUCKET_DATASETS:-phylo-datasets}
      S3_BUCKET_ARTIFACTS: ${S3_BUCKET_ARTIFACTS:-phylo-artifacts}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/$${S3_BUCKET_DATASETS};
      mc mb --ignore-existing local/$${S3_BUCKET_ARTIFACTS};
      echo 'minio buckets ready';
      printf '%s\n' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:PutObject\"],\"Resource\":\"arn:aws:s3:::'\"$${S3_BUCKET_ARTIFACTS}\"'/*\"}]}' > /tmp/methods-policy.json;
      mc admin policy create local phylo-methods-write /tmp/methods-policy.json 2>/dev/null || mc admin policy update local phylo-methods-write /tmp/methods-policy.json 2>/dev/null || true;
      mc admin user add local $${MINIO_METHODS_USER} $${MINIO_METHODS_PASSWORD} 2>/dev/null || true;
      mc admin policy attach local phylo-methods-write --user $${MINIO_METHODS_USER} 2>/dev/null || true;
      echo 'methods user ready';
      "
    profiles: ["dev", "prod"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    image: phylo-web:latest
    env_file:
      - ./.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on: [api]
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: .
        target: /srv
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
    command: sh -lc "npm -w web run dev -- -p ${WEB_PORT:-3000}"
    profiles: ["dev"]

  web-prod:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    image: phylo-web:latest
    env_file:
      - ./.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      api-prod:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles: ["prod"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: phylo-api:latest
    env_file:
      - ./.env
    environment:
      <<: *api_common_env
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      dowser:
        condition: service_started
      gctree:
        condition: service_started
      brepphylo:
        condition: service_started
      clonaltree:
        condition: service_started
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ${STORAGE_LOCAL_PATH:-runtime/storage}
        target: /runtime/storage
    command: sh -lc "alembic upgrade head && exec uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload"
    profiles: ["dev"]

  api-worker:
    image: phylo-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - ./.env
    environment:
      <<: *api_common_env
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ${STORAGE_LOCAL_PATH:-runtime/storage}
        target: /runtime/storage
    command: sh -lc "python -m apps.api.workers.run_worker"
    profiles: ["dev"]

  api-prod:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: phylo-api:latest
    env_file:
      - ./.env
    environment:
      <<: *api_common_env
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      dowser:
        condition: service_started
      gctree:
        condition: service_started
      brepphylo:
        condition: service_started
      clonaltree:
        condition: service_started
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ${STORAGE_LOCAL_PATH:-runtime/storage}
        target: /runtime/storage
    command: sh -lc "alembic upgrade head && exec uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    profiles: ["prod"]

  api-worker-prod:
    image: phylo-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - ./.env
    environment:
      <<: *api_common_env
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api-prod:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ${STORAGE_LOCAL_PATH:-runtime/storage}
        target: /runtime/storage
    command: sh -lc "python -m apps.api.workers.run_worker"
    profiles: ["prod"]

  dowser:
    platform: ${IMMCANTATION_PLATFORM:-linux/amd64}
    build:
      context: ./services/dowser
      dockerfile: Dockerfile
    image: phylo-dowser:latest
    env_file:
      - ./.env
    environment:
      <<: *method_common_env
      DNAPARS_PATH: ${DNAPARS_PATH:-/usr/local/bin/dnapars}
      DNAML_PATH: ${DNAML_PATH:-/usr/local/bin/dnaml}
      RAXML_BIN: ${RAXML_BIN:-/usr/local/bin/raxml-ng}
      IGPHYML_BIN: ${IGPHYML_BIN:-/usr/local/share/igphyml/src/igphyml}
      IGPHYML_MOTIFS: ${IGPHYML_MOTIFS:-/usr/local/share/igphyml/src/motifs}
      IGPHYML_PATH: ${IGPHYML_PATH:-/usr/local/share/igphyml/src/motifs}
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ${STORAGE_LOCAL_PATH:-runtime/storage}
        target: /runtime/storage
        read_only: true
    expose:
      - "${METHOD_DOWSER_CONTAINER_PORT:-8001}"
    command:
      [
        "R",
        "-q",
        "-e",
        "port <- as.integer(Sys.getenv('METHOD_DOWSER_CONTAINER_PORT', '8001')); pr <- plumber::plumb('/srv/plumber.R'); pr$$run(host='0.0.0.0', port=port)",
      ]
    profiles: ["dev", "prod"]

  gctree:
    build:
      context: ./services/gctree
      dockerfile: Dockerfile
    image: phylo-gctree:latest
    env_file:
      - ./.env
    environment:
      <<: *method_common_env
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ${STORAGE_LOCAL_PATH:-runtime/storage}
        target: /runtime/storage
        read_only: true
    expose:
      - "${METHOD_GCTREE_CONTAINER_PORT:-8002}"
    command: sh -lc "uvicorn app:app --host 0.0.0.0 --port ${METHOD_GCTREE_CONTAINER_PORT:-8002}"
    profiles: ["dev", "prod"]

  brepphylo:
    platform: ${IMMCANTATION_PLATFORM:-linux/amd64}
    build:
      context: ./services/brepphylo
      dockerfile: Dockerfile
    image: phylo-brepphylo:latest
    env_file:
      - ./.env
    environment:
      <<: *method_common_env
      DNAPARS_PATH: ${DNAPARS_PATH:-/usr/local/bin/dnapars}
      IGPHYML_BIN: ${IGPHYML_BIN:-/usr/local/share/igphyml/src/igphyml}
      IGPHYML_MOTIFS: ${IGPHYML_MOTIFS:-/usr/local/share/igphyml/src/motifs}
      IGPHYML_PATH: ${IGPHYML_PATH:-/usr/local/share/igphyml/src/motifs}
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ${STORAGE_LOCAL_PATH:-runtime/storage}
        target: /runtime/storage
        read_only: true
    expose:
      - "${METHOD_BREPPHYLO_CONTAINER_PORT:-8003}"
    command:
      [
        "R",
        "-q",
        "-e",
        "port <- as.integer(Sys.getenv('METHOD_BREPPHYLO_CONTAINER_PORT', '8003')); pr <- plumber::plumb('/srv/plumber.R'); pr$$run(host='0.0.0.0', port=port)",
      ]
    profiles: ["dev", "prod"]

  clonaltree:
    build:
      context: ./services/clonaltree
      dockerfile: Dockerfile
    image: phylo-clonaltree:latest
    env_file:
      - ./.env
    environment:
      <<: *method_common_env
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ${STORAGE_LOCAL_PATH:-runtime/storage}
        target: /runtime/storage
        read_only: true
    expose:
      - "${METHOD_CLONALTREE_CONTAINER_PORT:-8004}"
    command: sh -lc "uvicorn app:app --host 0.0.0.0 --port ${METHOD_CLONALTREE_CONTAINER_PORT:-8004}"
    profiles: ["dev", "prod"]

volumes:
  postgres_data:
  minio_data:
