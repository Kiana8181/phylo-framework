# docker-compose.yml  (only showing the service blocks)

x-env-common: &env_common
  CONTRACTS_DIR: /contracts
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  METHOD_DOWSER_URL: http://dowser:8001
  METHOD_GCTREE_URL: http://gctree:8002
  METHOD_BREPPHYLO_URL: http://brepphylo:8003
  METHOD_CLONALTREE_URL: http://clonaltree:8004
  HTTP_CLIENT_TIMEOUT: "600"
  SPEC_TIMEOUT: "60"
  RUNS_DIR: /shared
  DATABASE_URL: postgresql+asyncpg://phylo:phylo@postgres:5432/phylo
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/auth/google/callback}
  RQ_WORKER_CONCURRENCY: ${RQ_WORKER_CONCURRENCY:-4}
  RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-default}

services:
  # --- Database ---
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: phylo
      POSTGRES_PASSWORD: phylo
      POSTGRES_DB: phylo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phylo"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["dev", "prod"]

  # --- Redis (for task queue) ---
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["dev", "prod"]
  # --- UI: DEV ---
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: phylo-web:latest
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]
    volumes:
      - type: bind
        source: .
        target: /srv
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
    command: npm -w web run dev -- -p 3000
    profiles: ["dev"]

  # --- UI: PROD ---
  web-prod:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: phylo-web:latest
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8000
    depends_on: [api-prod]
    ports: ["3000:3000"]
    profiles: ["prod"]
    # no volumes; image is self-contained

  # --- API: DEV ---
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: phylo-api:latest
    environment:
      <<: *env_common
      RUNS_DIR: /runtime/runs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      dowser:
      gctree:
      brepphylo:
      clonaltree:
    ports: ["8000:8000"]
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ./runtime/runs
        target: /runtime/runs
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload
    profiles: ["dev"]

  # --- API: PROD ---
  api-prod:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: phylo-api:latest
    environment:
      <<: *env_common
      RUNS_DIR: /runtime/runs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      dowser:
      gctree:
      brepphylo:
      clonaltree:
    ports: ["8000:8000"]
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ./runtime/runs
        target: /runtime/runs
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    profiles: ["prod"]

  dowser:
    build:
      context: ./services/dowser
      dockerfile: Dockerfile
    image: phylo-dowser:latest
    environment:
      CONTRACTS_DIR: /contracts
      STRICT_CONTRACT_ROUTES: ${STRICT_CONTRACT_ROUTES:-true}
      RUNS_DIR: /runtime/runs
      IGPHYML_BIN: /usr/local/share/igphyml/src/igphyml
      IGPHYML_MOTIFS: /usr/local/share/igphyml/src/motifs
      IGPHYML_PATH: /usr/local/share/igphyml/src/motifs
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ./runtime/runs
        target: /runtime/runs
        read_only: true
    expose: ["8001"]
    profiles: ["dev","prod"]

  gctree:
    build:
      context: ./services/gctree
      dockerfile: Dockerfile
    image: phylo-gctree:latest
    environment:
      CONTRACTS_DIR: /contracts
      STRICT_CONTRACT_ROUTES: ${STRICT_CONTRACT_ROUTES:-true}
      RUNS_DIR: /runtime/runs
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ./runtime/runs
        target: /runtime/runs
        read_only: true
    expose: ["8002"]
    profiles: ["dev","prod"]

  brepphylo:
    build:
      context: ./services/brepphylo
      dockerfile: Dockerfile
    image: phylo-brepphylo:latest
    environment:
      CONTRACTS_DIR: /contracts
      STRICT_CONTRACT_ROUTES: ${STRICT_CONTRACT_ROUTES:-true}
      RUNS_DIR: /runtime/runs
      DNAPARS_PATH: /usr/local/bin/dnapars
      IGPHYML_BIN: /usr/local/share/igphyml/src/igphyml
      IGPHYML_MOTIFS: /usr/local/share/igphyml/src/motifs
      IGPHYML_PATH: /usr/local/share/igphyml/src/motifs
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ./runtime/runs
        target: /runtime/runs
        read_only: true
    expose: ["8003"]
    profiles: ["dev","prod"]

  clonaltree:
    build:
      context: ./services/clonaltree
      dockerfile: Dockerfile
    image: phylo-clonaltree:latest
    environment:
      CONTRACTS_DIR: /contracts
      STRICT_CONTRACT_ROUTES: ${STRICT_CONTRACT_ROUTES:-true}
      RUNS_DIR: /runtime/runs
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ./runtime/runs
        target: /runtime/runs
        read_only: true
    expose: ["8004"]
    profiles: ["dev","prod"]

  # --- Worker (for RQ tasks) ---
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: phylo-api:latest
    environment:
      <<: *env_common
      RUNS_DIR: /runtime/runs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./packages/contracts
        target: /contracts
        read_only: true
      - type: bind
        source: ./runtime/runs
        target: /runtime/runs
    command: python -m apps.api.worker
    profiles: ["dev", "prod"]

volumes:
  postgres_data:
  redis_data:
