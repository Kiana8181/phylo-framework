[pytest]
testpaths = apps/api/tests services/gctree/tests services/clonaltree/tests tests/integration tests/deployment
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = --strict-markers --import-mode=importlib
markers =
    integration: requires the isolated PostgreSQL/MinIO test services
    scientific: executes real scientific method services
    system: stops, kills and reconfigures containers of the isolated test stack (npm run test:system)

